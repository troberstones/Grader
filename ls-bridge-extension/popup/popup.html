<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LS Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 280px;
      background: #f9fafb;
      color: #111827;
    }
    header {
      background: #1d4ed8;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: white;
      border: 1px solid #e5e7eb;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.green  { background: #22c55e; }
    .dot.yellow { background: #f59e0b; }
    .dot.red    { background: #ef4444; }
    .dot.gray   { background: #9ca3af; }

    .status-label { flex: 1; }
    .status-label strong { display: block; }
    .status-label span { color: #6b7280; font-size: 11px; }

    label { display: block; font-size: 11px; font-weight: 500; color: #6b7280; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px #bfdbfe; }

    button {
      width: 100%;
      padding: 7px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:active { background: #1e40af; }

    .ls-info {
      font-size: 11px;
      color: #6b7280;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .ls-info strong { color: #374151; }

    footer {
      padding: 8px 16px;
      font-size: 10px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <header>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
    </svg>
    <h1>LS Bridge</h1>
  </header>

  <div class="body">
    <!-- Extension / LS tab status -->
    <div class="status-row" id="ls-status">
      <div class="dot gray" id="ls-dot"></div>
      <div class="status-label">
        <strong id="ls-status-title">Checking…</strong>
        <span id="ls-status-desc"></span>
      </div>
    </div>

    <!-- Grader app origin setting -->
    <div>
      <label for="grader-origin">Grader App URL</label>
      <input type="text" id="grader-origin" placeholder="http://localhost:3000" />
    </div>
    <button id="save-origin">Save</button>

    <!-- Detected LS session info -->
    <div class="ls-info" id="ls-info" style="display:none">
      <strong>Session detected</strong><br>
      Semester: <span id="ls-semester">–</span><br>
      Course: <span id="ls-course">–</span>
    </div>
  </div>

  <footer>Open the grader app and a Learning Suite course to begin syncing.</footer>

  <script src="popup.js"></script>
</body>
</html>
