name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # rsync is required by `npm run test:backup` (scripts/lib/backup-set.mjs
      # shells out to the real `rsync` binary for local-destination backups).
      # ubuntu-latest usually ships it already; installing explicitly keeps
      # this workflow correct even if the runner image ever drops it.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      # `next build` connects to the database at module-load time
      # (src/db/index.ts), so storage/grader.db has to exist first. This
      # mirrors the fresh-clone setup in README.md ("Setup: fresh clone ->
      # running app").
      - name: Initialize database
        run: npm run db:init

      - name: Build
        run: npx next build
